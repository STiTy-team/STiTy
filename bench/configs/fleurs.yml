# FLEURS en->ko speech translation. Latency and translation quality.
name: fleurs-en-ko-seg

dataset:
  name: fleurs
  limit: 20                  # the full split is ~63 min of audio at real-time pacing

languages:
  lang: en
  target: ko

stity:
  transcription:
    name: qwen3
    model: baseline
  translation:
    name: google             # free endpoint; fix the backend when comparing policies
  commit: seg
  vad:
    enabled: true
  gpu_memory_utilization: 0.5

metrics: [wer, fsl, laal, bleu, commit]

pacing:
  trailing_silence_ms: 4000

logs:
  top_k: 10
  rank_by: laal

[project]
name = "stity-bench-comet"
version = "0.0.0"
description = "COMET scoring for bench runs, in its own environment"
requires-python = ">=3.12,<3.13"

# unbabel-comet pins numpy<2 and protobuf<5, which would downgrade the shared
# .venv that vLLM runs in. It gets this environment instead. The metric code
# itself (core.utils.metrics) is pure Python and is imported from the repo.
# setuptools<81: torchmetrics 0.10.x (pulled in by unbabel-comet) imports
# pkg_resources, which setuptools 81 removed.
dependencies = [
    "unbabel-comet>=2.2.7",
    "setuptools<81",
]

[tool.uv]
package = false

[project]
name = "stity-bench-comet"
version = "0.0.0"
description = "COMET scoring for bench runs, in its own environment"
requires-python = ">=3.12,<3.13"

# unbabel-comet pins numpy<2 and protobuf<5, and vLLM 0.14 needs protobuf>=6.30,
# so the two cannot share an environment.
# setuptools<81: torchmetrics 0.10.x (pulled in by unbabel-comet) imports
# pkg_resources, which setuptools 81 removed.
dependencies = [
    "unbabel-comet>=2.2.7",
    "setuptools<81",
]

[tool.uv]
package = false

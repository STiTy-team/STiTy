name: ci/format

on:
  push:
    paths: ["bench/**", "server/**", ".github/workflows/ci-format.yml"]
  pull_request:
    paths: ["bench/**", "server/**", ".github/workflows/ci-format.yml"]

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/ruff-action@v4.1.0
        with:
          version: "0.16.9"
          src: bench server
          args: format --check --diff

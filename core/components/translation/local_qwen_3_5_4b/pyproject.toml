[project]
name = "stity-qwen35-vllm"
version = "0.0.0"
description = "vLLM server for the qwen3.5 translator, in its own environment"
requires-python = ">=3.12,<3.13"

# Qwen3.5 needs vllm>=0.17 and transformers>=5.2; the ASR side pins vllm 0.14 and
# transformers 4.57.6, so the two cannot share an environment.
dependencies = [
    "vllm>=0.17",
]

[tool.uv]
package = false
